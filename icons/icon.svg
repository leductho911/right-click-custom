<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)"/>

  <!-- Calculator Screen -->
  <rect x="24" y="22" width="80" height="26" rx="8" fill="url(#screenGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Result text simulation -->
  <text x="96" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#38bdf8" text-anchor="end">110.00</text>

  <!-- Keypad Buttons -->
  <!-- Row 1 -->
  <circle cx="37" cy="64" r="8" fill="rgba(255,255,255,0.18)"/>
  <text x="37" y="68" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">+</text>

  <circle cx="64" cy="64" r="8" fill="rgba(255,255,255,0.18)"/>
  <text x="64" y="67" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">−</text>

  <circle cx="91" cy="64" r="8" fill="rgba(255,255,255,0.25)"/>
  <text x="91" y="68" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 2 -->
  <circle cx="37" cy="88" r="8" fill="rgba(255,255,255,0.18)"/>
  <text x="37" y="92" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">÷</text>

  <circle cx="64" cy="88" r="8" fill="rgba(255,255,255,0.18)"/>
  <text x="64" y="92" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">%</text>

  <!-- Equals Accent Button -->
  <circle cx="91" cy="88" r="8" fill="#10b981"/>
  <text x="91" y="92" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">=</text>
</svg>
