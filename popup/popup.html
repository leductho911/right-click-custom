<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Math Quick Tool</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="popup-brand">
        <div class="popup-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="4" y="2" width="16" height="20" rx="4" stroke-width="2"/>
            <line x1="8" y1="6" x2="16" y2="6" stroke-width="2"/>
            <line x1="16" y1="14" x2="16" y2="18" stroke-width="2"/>
            <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="popup-title">
          <h2>Smart Math</h2>
          <span>Right-Click Menu</span>
        </div>
      </div>
      <button id="open-options-btn" class="icon-btn" title="Open Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-width="2"/></svg>
      </button>
    </header>

    <!-- Quick Calculator Input -->
    <div class="popup-input-section">
      <label for="popup-input">Calculate with custom rules:</label>
      <div class="popup-input-wrap">
        <input type="text" id="popup-input" placeholder="Enter number or formula..." value="100">
        <button id="popup-clear-btn" title="Clear">✕</button>
      </div>
    </div>

    <!-- Quick Results List -->
    <div class="popup-results-section">
      <div class="results-header">
        <span>Active Rules</span>
        <span class="click-hint">Click any to copy</span>
      </div>
      <div id="popup-results-list" class="popup-results-list">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="manage-rules-link" class="footer-action-btn">
        <span>⚙️ Open Full Settings & Rules Editor</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7" stroke-width="2"/></svg>
      </button>
    </footer>
  </div>

  <div id="copied-toast" class="copied-toast hidden">Copied!</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
